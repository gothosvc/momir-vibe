<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Momir Vibe</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="page-header">
    <h1>Momir Vibe</h1>
    <p class="subtitle">Fake creature cards for Momir-style play. Nothing here is a real Magic card.</p>
  </header>

  <main>
    <form id="controls" class="controls">
      <label for="mana-value">
        Mana value
        <input type="number" id="mana-value" name="mana-value" min="0" max="16" value="3" required />
      </label>
      <label for="mayhem">
        Mayhem
        <select id="mayhem" name="mayhem">
          <option value="off" selected>Off</option>
          <option value="text">Text</option>
          <option value="full">Full</option>
          <option value="unhinged">Unhinged</option>
        </select>
      </label>
      <button type="submit" id="generate-btn">Generate</button>
    </form>

    <p id="error" class="error" hidden></p>

    <div id="card" class="card colorless" hidden>
      <div class="card-header">
        <span id="card-name" class="card-name"></span>
        <span id="card-mana" class="card-mana"></span>
      </div>
      <div id="card-art" class="card-art" aria-hidden="true">
        <img id="card-art-image" class="card-art-image" alt="" hidden />
        <span id="card-art-label" class="card-art-label">Momir Vibe</span>
      </div>
      <div id="card-type" class="card-type"></div>
      <div class="card-text-box">
        <div id="card-text" class="card-text"></div>
        <div id="card-pt" class="card-pt"></div>
      </div>
      <div id="card-meta" class="card-meta"></div>
    </div>
  </main>

  <script src="/app.js"></script>
</body>
</html>
